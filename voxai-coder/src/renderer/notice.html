<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>VoxAI Coder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;700&family=Sometype+Mono:wght@400;500&display=swap">
<style>
/* A session needs you: the card in the corner (main/attention.js). The app's own
   approval box, cut down to what you need to decide: what, where, and the answers. */
:root{
  --deep:#08080a; --panel2:#17171b; --sel:#1f1f24; --edge:#232327; --edge2:#2e2e34;
  --ink:#e4e2df; --mut:#b3b0ab; --sub:#9d9891; --faint:#6a6762;
  --gold:#c8a961; --tone:#c8a961;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:Chivo,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none}
.wrap{height:100%;padding:10px;display:flex;align-items:flex-end}
.card{position:relative;width:100%;height:118px;display:flex;flex-direction:column;gap:8px;padding:11px 12px 10px;background:var(--panel2);border:1px solid var(--edge2);border-radius:12px;overflow:hidden;cursor:pointer;
  box-shadow:0 10px 30px rgba(0,0,0,.55);opacity:0;transform:translateY(9px);transition:opacity .18s cubic-bezier(.22,.61,.36,1),transform .18s cubic-bezier(.22,.61,.36,1)}
.card.in{opacity:1;transform:none}
.card.out{opacity:0;transform:none;transition:opacity .12s ease-in}
.h{display:flex;align-items:center;gap:7px;min-width:0}
.h b{flex:none;font-size:13.5px;font-weight:700;color:var(--ink)}
.h span{min-width:0;color:var(--faint);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{margin-left:auto;flex:none;width:22px;height:22px;border:0;border-radius:5px;background:transparent;color:var(--faint);font-size:15px;line-height:20px;padding:0;cursor:pointer}
.x:hover{background:var(--sel);color:var(--ink)}
.what{flex:1;min-height:0;margin:0;background:var(--deep);border:1px solid var(--edge);border-radius:8px;padding:6px 10px;font:12.5px/18px "Sometype Mono",Consolas,monospace;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.ask .what{background:transparent;border:0;padding:0 1px;font:13px/17px Chivo,"Segoe UI",sans-serif;color:var(--mut);white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.acts{display:flex;gap:6px;justify-content:flex-end;min-width:0}
.b{height:26px;min-width:0;padding:0 11px;border:1px solid var(--edge2);border-radius:7px;background:transparent;color:var(--ink);font:600 12px Chivo,"Segoe UI",sans-serif;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b:hover{background:var(--sel)}
.b.pri{background:rgba(200,169,97,.16);border-color:rgba(200,169,97,.55);color:var(--gold)}
.b.pri:hover{background:rgba(200,169,97,.26)}
.b.no{color:var(--sub)}
/* Time left before it tucks away (paused while the pointer is on it). */
.left{position:absolute;left:12px;right:12px;bottom:0;height:2px;border-radius:1px;background:var(--tone);opacity:.5;transform-origin:left;transform:scaleX(1)}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="card" role="alert">
    <div class="h"><b id="t"></b><span id="s"></span><button class="x" id="x" type="button" title="Dismiss" aria-label="Dismiss">&times;</button></div>
    <div class="what" id="w"></div>
    <div class="acts" id="acts"></div>
    <div class="left" id="left"></div>
  </div>
</div>
<script src="notice.js"></script>
</body>
</html>
